name: Deploy to Contabo

on:
  push:
    branches:
      - main  # or 'prod' - change to your production branch
  workflow_dispatch:

concurrency:
  group: contabo-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CONTABO_DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        run: ssh-keyscan -H "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts

      - name: Send Turnstile site key and deploy
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          printf '%s' "$TURNSTILE_SITE_KEY" | ssh "root@$CONTABO_HOST" \
            'umask 077; key_file=$(mktemp); trap "rm -f \"$key_file\"" EXIT; cat > "$key_file"; cd /opt/companylandingpage/repo; git fetch origin main; git checkout --force -B main origin/main; deploy/deploy.sh "$key_file" main'